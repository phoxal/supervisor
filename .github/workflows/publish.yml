name: publish
# Review and merge the version PR normally, then dispatch on its approved revision.
on:
  workflow_dispatch:
    inputs:
      publication-tool-version:
        description: Exact released publication tool version.
        type: string
        required: true
      package:
        description: Independently versioned package to submit for registry review.
        type: choice
        required: true
        options:
          - phoxal-supervisor
permissions:
  contents: read
concurrency:
  group: supervisor-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          repositories: registry
      - name: Install the independently selected publication tool
        run: cargo install cargo-phoxal --registry phoxal --version "${{ inputs.publication-tool-version }}" --root "$RUNNER_TEMP/tool" --locked
      - name: Verify the archive and submit the selected package for registry review
        env:
          PHOXAL_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            phoxal-supervisor) path=. ;;
            *) echo "unsupported publication package" >&2; exit 1 ;;
          esac
          "$RUNNER_TEMP/tool/bin/cargo-phoxal" publish application "$PACKAGE" --path "$path"
