
[package]
name = "phoxal-supervisor-runtime-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
description = "Authored runtime input for supervisor process acceptance."

[[bin]]
name = "supervisor-test-runtime"
path = "src/main.rs"

[build-dependencies]
phoxal = { "version" = "0.70.0", "default-features" = false, "features" = ["build"] }

[dependencies]
phoxal = { "version" = "0.70.0", "default-features" = false, "features" = ["runtime"] }

[lints]

[lints.rust]
unused = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
