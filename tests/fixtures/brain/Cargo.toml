
[package]
name = "phoxal-countdown-brain-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
description = "Authored brain consumer receiving countdown finished events through the graph."

[[bin]]
name = "countdown-brain-fixture"
path = "src/main.rs"

[dependencies]
phoxal = { "version" = "0.69.0", "default-features" = false, "features" = ["runtime"] }

[build-dependencies]
phoxal = { "version" = "0.69.0", "default-features" = false, "features" = ["build"] }

[dev-dependencies]
serde_json = { "version" = "1.0.149" }

[lints]

[lints.rust]
unused = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
