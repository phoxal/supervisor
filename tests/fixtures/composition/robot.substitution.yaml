schema: phoxal/robot/v0
robot:
  id: contract-robot
services:
  consumer:
    source: { path: ../consumer }
  encoder_source:
    source: { path: ../encoder-a }
  backup_source:
    source: { path: ../encoder-b }
connections:
  - from: consumer.inspect
    to: brain.inspect
  - from: backup_source.encoder
    to: consumer.encoder
  - from: encoder_source.ticks
    to: consumer.ticks
  - from: encoder_source.read_encoder
    to: consumer.read_encoder
  - from: backup_source.measure_encoder
    to: consumer.read_backup
supervisor:
  source: { path: ../../.. }
